[project]
name = "h2copilot-api"
version = "0.1.0"
description = "H2 Manual Copilot API (FastAPI, modular monolith)"
requires-python = ">=3.12,<3.13"
# 依赖策略（技术规范 §7）：版本范围写在 pyproject，精确解析结果冻结在 uv.lock 并提交。
# 不引入 MVP 主链路之外的依赖：数据库/模型 SDK 等在 Phase 5 对应任务时再加入。
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h2copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F 基础正确性；I 导入排序；UP 现代语法；B 常见缺陷
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# 基线阶段先保证可类型检查通过；Phase 5 起随实现逐步收紧到 strict
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
